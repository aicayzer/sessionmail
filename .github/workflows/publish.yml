name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm >=11.5.1. Node 22.14 (this package's
          # own floor) bundles npm 10.9.2, too old — Node 24 bundles a
          # compliant npm already. npm 12+ in turn needs Node >=22.22.2/24.15,
          # so pin rather than chase "latest" here.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test
      - run: npm publish
